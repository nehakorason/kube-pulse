# Prometheus scrape config for an in-cluster deployment.
# Intended to be mounted into the Prometheus pod via monitoring/k8s manifests
# or supplied to an existing kube-prometheus-stack installation as an
# additional scrape config / ServiceMonitor equivalent.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: kubepulse-app-k8s
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["kubepulse"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: kubepulse
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_number]
        regex: "8000"
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    metrics_path: /metrics

  # kube-state-metrics exposes deployment/replica/pod-restart data used by
  # the "pod availability" and "pod restart" panels/alerts.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

  # cAdvisor / node-exporter style container CPU & memory metrics, typically
  # already scraped by kube-prometheus-stack under this job name.
  - job_name: kubelet-cadvisor
    scheme: https
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
