name: CD

# Builds and publishes the KubePulse image to GitHub Container Registry, and
# (optionally) deploys it to a Kubernetes cluster reachable from a
# self-hosted runner or via a configured kubeconfig secret.
#
# Required repository secrets for a real deployment:
#   KUBE_CONFIG_DATA   - base64-encoded kubeconfig for the target cluster
#                         (only needed if you enable the `deploy` job)
#
# GITHUB_TOKEN (automatically provided by GitHub Actions) is used to push to
# ghcr.io; no additional registry secret is required for that step.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes after build"
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.deploy_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select single deploy image tag
        id: deploy_tag
        run: |
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -m1 ':sha-')"
          if [ -z "$TAG" ]; then
            echo "::error::Could not find a deterministic sha-based tag in metadata-action output"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event.inputs.deploy == 'true' }}
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "::error::KUBE_CONFIG_DATA secret is not configured. Set it in repository settings before running a deployment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"

      - name: Set image and apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/rbac.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl set image deployment/kubepulse kubepulse=${{ needs.build-and-push.outputs.image_tag }} -n kubepulse
          kubectl rollout status deployment/kubepulse -n kubepulse --timeout=180s
