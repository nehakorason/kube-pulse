apiVersion: v1
kind: Service
metadata:
  name: kubepulse
  namespace: kubepulse
  labels:
    app: kubepulse
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: kubepulse
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
