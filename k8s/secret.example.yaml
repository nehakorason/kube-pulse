# Example only — KubePulse's demo endpoints do not require any secret to
# function. This file demonstrates how a real secret would be wired in
# (e.g. an API token for a downstream dependency) without committing actual
# secret material to the repository.
#
# To use: copy to k8s/secret.yaml, fill in real base64-encoded values, and
# DO NOT commit k8s/secret.yaml (it is listed in .gitignore).
#
# kubectl create secret generic kubepulse-secret \
#   --namespace kubepulse \
#   --from-literal=EXAMPLE_API_TOKEN=changeme
apiVersion: v1
kind: Secret
metadata:
  name: kubepulse-secret
  namespace: kubepulse
  labels:
    app: kubepulse
type: Opaque
stringData:
  EXAMPLE_API_TOKEN: "changeme"
